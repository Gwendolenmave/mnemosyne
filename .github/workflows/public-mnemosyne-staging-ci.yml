name: public-mnemosyne-staging-ci

on:
  push:
    branches:
      - main
      - "fix/public-*"

permissions:
  contents: read

concurrency:
  group: public-mnemosyne-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Mnemosyne public verify
    if: >-
      github.repository == 'Gwendolenmave/mnemosyne' &&
      github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Clear dedicated verification checkout
        shell: bash
        run: rm -rf "$GITHUB_WORKSPACE/_public_mnemosyne_verify"

      - name: Checkout exact head only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: _public_mnemosyne_verify
          fetch-depth: 1
          persist-credentials: false

      - name: Set up required Node
        uses: actions/setup-node@v4
        with:
          node-version-file: _public_mnemosyne_verify/.nvmrc

      - name: Confirm isolated checkout
        shell: bash
        working-directory: _public_mnemosyne_verify
        run: |
          set -euo pipefail
          node --version
          npm --version
          test "$(git rev-list --all --count)" -eq 1

      - name: Install locked dependencies
        working-directory: _public_mnemosyne_verify
        run: npm ci --ignore-scripts

      - name: Run complete public verification
        shell: bash
        working-directory: _public_mnemosyne_verify
        run: |
          set -euo pipefail
          npm run verify
